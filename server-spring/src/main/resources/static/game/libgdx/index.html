<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tankzors - HTML5</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #1a1a2e;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e676;
            font-size: 16px;
            text-align: center;
        }

        #loading.hidden {
            display: none;
        }

        canvas {
            display: block;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="loading">Đang tải game…</div>

    <!-- LibGDX GWT will inject the game canvas into <body>. LevelId is read by
         HtmlLauncher via Window.Location.getParameter. -->
    <!-- Đổi version khi phát hành để iframe không giữ bootstrap GWT cũ trong cache. -->
    <script type="text/javascript" language="javascript" src="tankzorshtml/tankzorshtml.nocache.js?v=campaign-local-v2"></script>
    <script>
        // LibGDX tự tạo canvas sau khi preload assets hoàn tất.
        // Ẩn overlay HTML ban đầu ngay khi canvas xuất hiện.
        (function () {
            var loading = document.getElementById('loading');
            var observer = new MutationObserver(function () {
                var canvas = document.querySelector('canvas');
                if (canvas) {
                    // Đảm bảo iframe/canvas nhận bàn phím ngay khi game sẵn sàng.
                    // pointerdown giữ focus đúng sau khi người chơi click lại game.
                    canvas.setAttribute('tabindex', '0');
                    canvas.addEventListener('pointerdown', function () {
                        canvas.focus();
                    });
                    window.focus();
                    canvas.focus();
                    loading.classList.add('hidden');
                    observer.disconnect();
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        })();
    </script>
</body>
</html>
