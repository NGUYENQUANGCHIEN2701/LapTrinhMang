<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/campaigns.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-wide">
    <div style="text-align: center; margin-bottom: 1.5rem;">
        <h2 class="page-title" style="font-size: 2.2rem; letter-spacing: 3px; font-weight: 800; text-transform: uppercase;">
            Chiến dịch
        </h2>
    </div>

    <div class="campaign-grid">
        <div class="card level-card"
             th:each="lvl : ${levels}"
             th:classappend="${unlockedLevels.contains(lvl.id)} ? 'unlocked' : 'locked'">
            <h3 class="level-name" th:text="${lvl.name}">Màn 1</h3>
            <p class="level-desc" th:text="${lvl.description}">Mô tả</p>
            <a class="btn btn-primary level-play"
               th:if="${unlockedLevels.contains(lvl.id)}"
               th:href="@{/play(levelId=${lvl.id})}">▶ BẮT ĐẦU</a>
            <span class="btn btn-ghost level-play disabled"
               th:if="${completedLevels.contains(lvl.id)}"
               title="Mỗi màn chỉ được chơi một lần">&#10003; Đã hoàn thành</span>
            <span class="btn btn-ghost level-play disabled"
               th:if="${!unlockedLevels.contains(lvl.id) and !completedLevels.contains(lvl.id)}"
               title="Hoàn thành màn trước để mở khóa">&#128274; Đã khóa</span>
        </div>
    </div>

    <p class="page-subtitle" style="text-align: center; margin-top: 1.5rem;"
       th:if="${unlockedLevels.isEmpty()}">Bạn đã hoàn thành toàn bộ chiến dịch.</p>

    <div class="form-actions" style="justify-content: center; margin-top: 2rem;">
        <a class="btn btn-ghost" th:href="@{/game-menu}">← Quay lại Menu Game</a>
    </div>

    <audio id="audioBtnClick" th:src="@{/sounds/ui_button_down.ogg}" preload="auto"></audio>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var clickAudio = document.getElementById('audioBtnClick');
            document.querySelectorAll('.btn:not(.disabled)').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    if (clickAudio) {
                        clickAudio.currentTime = 0;
                        clickAudio.play().catch(function () {});
                    }
                });
            });
        });
    </script>
</section>
</body>
</html>
