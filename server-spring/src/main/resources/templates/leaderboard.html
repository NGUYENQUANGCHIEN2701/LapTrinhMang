<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/leaderboard.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-wide leaderboard-page">
    <h2 class="page-title">Bảng xếp hạng</h2>

    <div class="map-tabs">
        <a th:each="m : ${maps}"
           th:href="@{/leaderboard(mapId=${m})}"
           th:classappend="${m == currentMap} ? 'active' : ''"
           th:text="${#strings.capitalize(#strings.replace(m, '_', ' '))}">Campaign 1</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-warning" role="alert"
         th:text="${errorMessage}">Leaderboard unavailable</div>

    <table class="leaderboard-table" th:unless="${errorMessage}">
        <thead>
            <tr>
                <th>Hạng</th>
                <th>Người chơi</th>
                <th>Điểm</th>
                <th>Thời gian (giây)</th>
                <th>HP còn</th>
                <th>Tạo lúc</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${leaderboardEntries}"
                th:classappend="${row.rank <= 3} ? 'rank-' + ${row.rank} : ''">
                <td th:text="${row.rank}">1</td>
                <td th:text="${row.playerName}">Hero</td>
                <td th:text="${row.score}">1000</td>
                <td th:text="${row.timeSeconds}">60</td>
                <td th:text="${row.hpRemain}">60</td>
                <td th:text="${row.createdAt}">01/01/2026 12:00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(leaderboardEntries)}">
                <td colspan="6" class="empty">
                    Chưa có điểm nào cho màn này. Hãy là người đầu tiên!
                </td>
            </tr>
        </tbody>
    </table>

    <div class="form-actions">
        <a class="btn btn-ghost" th:href="@{/menu}">Quay lại</a>
    </div>
</section>
</body>
</html>
