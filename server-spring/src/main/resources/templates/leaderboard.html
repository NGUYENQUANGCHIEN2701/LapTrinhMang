<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/leaderboard.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-wide leaderboard-page">
    <h2 class="page-title">Leaderboard</h2>

    <div class="map-tabs">
        <a th:each="m : ${maps}"
           th:href="@{/leaderboard(mapId=${m})}"
           th:classappend="${m == currentMap} ? 'active' : ''"
           th:text="${m}">campaign_1</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-warning" role="alert"
         th:text="${errorMessage}">Leaderboard unavailable</div>

    <table class="leaderboard-table" th:unless="${errorMessage}">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Map</th>
                <th>Score</th>
                <th>Time (s)</th>
                <th>HP còn</th>
                <th>Tạo lúc</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="row : ${leaderboardEntries}"
                th:classappend="${row.rank <= 3} ? 'rank-' + ${row.rank} : ''">
                <td th:text="${row.rank}">1</td>
                <td th:text="${row.playerName}">Hero</td>
                <td th:text="${row.mapId}">campaign_1</td>
                <td th:text="${row.score}">1000</td>
                <td th:text="${row.timeSeconds}">60</td>
                <td th:text="${row.hpRemain}">60</td>
                <td th:text="${row.createdAt}">01/01/2026 12:00</td>
            </tr>
            <tr th:if="${#lists.isEmpty(leaderboardEntries)}">
                <td colspan="7" class="empty">
                    Chưa có điểm nào cho map này. Hãy là người đầu tiên!
                </td>
            </tr>
        </tbody>
    </table>

    <div class="form-actions" style="justify-content: center; margin-top: 1.5rem;">
        <a class="btn btn-ghost" th:href="@{/}">← Về Trang Chủ</a>
    </div>

    <audio id="audioBtnClick" th:src="@{/sounds/ui_button_down.ogg}" preload="auto"></audio>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var clickAudio = document.getElementById('audioBtnClick');
            document.querySelectorAll('.map-tabs a, .btn').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    if (clickAudio) {
                        clickAudio.currentTime = 0;
                        clickAudio.play().catch(function () {});
                    }
                });
            });
        });
    </script>
</section>
</body>
</html>
