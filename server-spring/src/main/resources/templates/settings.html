<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/settings.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-narrow">
    <h2 class="page-title">Settings</h2>
    <p class="page-subtitle">Cài đặt được lưu trong phiên làm việc của trình duyệt (session).</p>

    <form th:action="@{/settings}" method="post" class="settings-form card">
        <div class="form-group">
            <label for="musicVolume">Music volume (0-100)</label>
            <input type="number" id="musicVolume" name="musicVolume"
                   min="0" max="100" step="1"
                   th:value="${settings.musicVolume}" />
        </div>

        <div class="form-group">
            <label for="soundVolume">Sound volume (0-100)</label>
            <input type="number" id="soundVolume" name="soundVolume"
                   min="0" max="100" step="1"
                   th:value="${settings.soundVolume}" />
        </div>

        <div class="form-group">
            <label for="language">Language</label>
            <select id="language" name="language">
                <option value="vi" th:selected="${settings.language == 'vi'}">Tiếng Việt</option>
                <option value="en" th:selected="${settings.language == 'en'}">English</option>
            </select>
        </div>

        <div class="form-group form-check">
            <input type="checkbox" id="showFps" name="showFps"
                   th:checked="${settings.showFps}" />
            <label for="showFps">Show FPS</label>
        </div>

        <div class="form-group">
            <label for="gameScale">Game scale (50-200%)</label>
            <input type="number" id="gameScale" name="gameScale"
                   min="50" max="200" step="10"
                   th:value="${settings.gameScale}" />
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a class="btn btn-ghost" th:href="@{/menu}">Back</a>
        </div>
    </form>
</section>
</body>
</html>
