<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign - Tankzors Pro</title>
    <style>
        .campaign-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 800px;
        }
        .level-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 1.2rem;
            transition: all 0.2s;
            position: relative;
        }
        .level-card.unlocked a {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .level-card.unlocked:hover {
            background: rgba(0, 230, 118, 0.08);
            border-color: #00e676;
        }
        .level-card.locked {
            opacity: 0.55;
            background: rgba(0, 0, 0, 0.3);
        }
        .level-card .lock-icon {
            position: absolute;
            top: 0.7rem;
            right: 0.7rem;
            font-size: 1.2rem;
        }
        .level-card .name {
            font-size: 1.15rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 0.4rem;
        }
        .level-card.locked .name { color: #888; }
        .level-card .difficulty-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .diff-EASY { background: #2e7d32; }
        .diff-MEDIUM { background: #f57f17; }
        .diff-HARD { background: #c62828; }
        .level-card .desc {
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-bottom: 0.3rem;
        }
        .level-card .meta {
            font-size: 0.8rem;
            color: #777;
        }
        .note {
            color: #999;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            max-width: 600px;
        }
        .note code {
            background: #222;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <h2 style="color:#00e676; margin-bottom:1rem;">Chọn màn Campaign</h2>
    <div class="campaign-list">
        <div class="level-card" th:each="lvl : ${levels}"
             th:classappend="${unlockedLevels.contains(lvl.id)} ? 'unlocked' : 'locked'">
            <a th:if="${unlockedLevels.contains(lvl.id)}" th:href="@{/play(levelId=${lvl.id})}">
                <div class="name" th:text="${lvl.title}">Màn 1</div>
                <div class="difficulty-badge" th:classappend="'diff-' + ${lvl.difficulty}"
                     th:text="${lvl.difficultyLabel}">EASY</div>
                <div class="desc" th:text="${lvl.desc}">Mô tả</div>
                <div class="meta">
                    <span th:text="${lvl.enemiesCount} + ' AI'"></span>
                    · <span th:text="${lvl.difficulty}"></span>
                </div>
            </a>
            <div th:unless="${unlockedLevels.contains(lvl.id)}">
                <div class="lock-icon">🔒</div>
                <div class="name" th:text="${lvl.title}">Màn 2</div>
                <div class="difficulty-badge" th:classappend="'diff-' + ${lvl.difficulty}"
                     th:text="${lvl.difficultyLabel}">MEDIUM</div>
                <div class="desc" th:text="${lvl.desc}">Mô tả</div>
                <div class="meta">Hoàn thành màn trước để mở khóa</div>
            </div>
        </div>
    </div>
    <p class="note">
        Tiến trình được lưu theo session của trình duyệt (HttpSession).
        Session ID của bạn: <code th:text="${sessionId}">?</code>
    </p>
</div>
</body>
</html>
