<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign - Tankzors Pro</title>
    <style>
        .campaign-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 800px;
        }
        .level-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 1.2rem;
            transition: all 0.2s;
        }
        .level-card a {
            color: inherit;
            text-decoration: none;
            display: block;
        }
        .level-card:hover {
            background: rgba(0, 230, 118, 0.08);
            border-color: #00e676;
        }
        .level-card .name {
            font-size: 1.15rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 0.4rem;
        }
        .level-card .difficulty {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .diff-EASY { background: #2e7d32; }
        .diff-MEDIUM { background: #f57f17; }
        .diff-HARD { background: #c62828; }
        .level-card .desc {
            font-size: 0.9rem;
            color: #b0b0b0;
            margin-bottom: 0.3rem;
        }
        .level-card .meta {
            font-size: 0.8rem;
            color: #777;
        }
        .note {
            color: #999;
            font-size: 0.85rem;
            margin-top: 1rem;
            text-align: center;
            max-width: 600px;
        }
    </style>
</head>
<body>
<div th:fragment="content">
    <h2 style="color:#00e676; margin-bottom:1rem;">Chọn màn Campaign</h2>
    <div class="campaign-list">
        <div class="level-card" th:each="lvl : ${levels}">
            <a th:href="@{/play(levelId=${lvl.id})}">
                <div class="name" th:text="${lvl.title}">Màn 1</div>
                <div class="difficulty" th:classappend="'diff-' + ${lvl.difficulty}"
                     th:text="${lvl.difficultyLabel}">EASY</div>
                <div class="desc" th:text="${lvl.desc}">Mô tả</div>
                <div class="meta">
                    <span th:text="${lvl.enemiesCount} + ' AI'"></span>
                    · <span th:text="${lvl.difficulty}"></span>
                </div>
            </a>
        </div>
    </div>
    <p class="note">Màn chơi phải được mở khoá tuần tự. Trạng thái mở khoá hiện nằm ở client (localStorage). Phase sau sẽ chuyển sang server.</p>
</div>
</body>
</html>
