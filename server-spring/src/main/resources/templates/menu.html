<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/menu.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="menu-page">
    <div class="tankzors-banner-wrap">
        <div class="banner-top-strip">
            <img th:src="@{/images/gui/menu_pict.png}" alt="Tankzors Banner" class="banner-tank-art" />
        </div>
        <div class="banner-fade-strip"></div>
    </div>

    <div class="menu-hero">
        <h1 class="game-title">TANKZORS</h1>
    </div>

    <div class="menu-actions">
        <a class="btn btn-primary btn-lg" th:href="@{/game-menu}">
            Game
            <span class="btn-hint">Bắt đầu chơi</span>
        </a>
        <a class="btn btn-secondary btn-lg" th:href="@{/settings}">
            Settings
            <span class="btn-hint">Âm thanh</span>
        </a>
        <a class="btn btn-secondary btn-lg" th:href="@{/leaderboard}">
            Leaderboard
            <span class="btn-hint">Bảng xếp hạng</span>
        </a>
    </div>

    <audio id="sfx-click" th:src="@{/sounds/ui_button_down.ogg}" preload="auto"></audio>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var sfx = document.getElementById('sfx-click');
            var playClick = function () {
                if (!sfx) return;
                try {
                    sfx.currentTime = 0;
                    sfx.volume = 0.35;
                    sfx.play();
                } catch (ignored) {}
            };

            document.querySelectorAll('.btn, .site-nav a').forEach(function (btn) {
                btn.addEventListener('click', playClick);
            });

        });
    </script>
</section>
</body>
</html>
