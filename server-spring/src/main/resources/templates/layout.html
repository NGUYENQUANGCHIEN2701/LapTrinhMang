<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content, pageCss)">
<head>
    <th:block th:replace="~{fragments/head :: head(${pageTitle})}"></th:block>
    <th:block th:replace="${pageCss}"></th:block>
</head>
<body class="site-body">
    <div th:replace="~{fragments/navbar :: navbar}">Navbar</div>
    <main class="page-main">
        <div class="container">
            <div th:replace="~{fragments/flash-message :: flash}">Flash messages</div>
            <div th:replace="${content}">Page content</div>
        </div>
    </main>
</body>
</html>
