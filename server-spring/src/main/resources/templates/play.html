<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/play.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-wide play-page">
    <div class="play-header">
        <h2 class="page-title">TANKZORS BATTLEFIELD</h2>
        <div class="play-header-right">
            <div class="play-mission-badge">
                <span class="badge-label">Mission:</span>
                <strong th:text="${levelName}">Màn 1</strong>
            </div>
            <div class="play-actions">
                <button type="button" class="btn btn-ghost" id="btn-fullscreen" title="Phóng to toàn màn hình (F11 cho cả trình duyệt)">
                    ⛶ Toàn màn hình
                </button>
                <a class="btn btn-secondary" th:href="@{/campaigns}">
                    ← Chiến dịch
                </a>
            </div>
        </div>
    </div>

    <!-- LibGDX HTML5 mount point inside arcade cabinet frame -->
    <div class="game-cabinet">
        <div id="game-container"
             class="game-container"
             th:attr="data-level-id=${selectedLevelId}">
            <!-- iframe load GWT build; truyen levelId, soundVol, musicVol qua query string. -->
            <iframe id="game-frame"
                    class="game-frame"
                    th:src="@{/game/libgdx/index.html(levelId=${selectedLevelId},soundVol=${settings != null ? settings.soundVolume : 80},musicVol=${settings != null ? settings.musicVolume : 70})}"
                    title="Tankzors Game"
                    tabindex="0"
                    allow="autoplay; fullscreen; gamepad"
                    allowfullscreen></iframe>
            <noscript>
                <div class="game-placeholder">
                    <p class="placeholder-title">JavaScript is required</p>
                    <p class="muted">Game LibGDX HTML5 cần JavaScript để chạy.</p>
                </div>
            </noscript>
        </div>
    </div>

    <div class="play-toolbar">
        <div class="controls-hint">
            <span><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> Di chuyển</span>
            <span><kbd>Space</kbd> / <kbd>J</kbd> Bắn</span>
            <span><kbd>X</kbd> Lùi</span>
            <span><kbd>Q</kbd> Vật phẩm</span>
            <span><kbd>B</kbd> Workshop</span>
            <span><kbd>M</kbd> Âm thanh</span>
            <span><kbd>Enter</kbd> Xác nhận / Màn tiếp</span>
        </div>
    </div>

    <audio id="audioBtnClick" th:src="@{/sounds/ui_button_down.ogg}" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var frame = document.getElementById('game-frame');
            var container = document.getElementById('game-container');
            var fsBtn = document.getElementById('btn-fullscreen');
            var clickAudio = document.getElementById('audioBtnClick');

            var playClick = function () {
                if (clickAudio) {
                    clickAudio.currentTime = 0;
                    clickAudio.play().catch(function () {});
                }
            };

            // Focus vào iframe để các phím bàn phím truyền tới LibGDX ngay lập tức
            var focusGame = function () {
                if (!frame) return;
                frame.focus();
                try {
                    frame.contentWindow.focus();
                } catch (ignored) {}
            };

            if (frame) {
                frame.addEventListener('load', focusGame);
                frame.addEventListener('pointerdown', focusGame);
                focusGame();
            }

            // Fullscreen toggle
            if (fsBtn && container) {
                fsBtn.addEventListener('click', function () {
                    playClick();
                    if (!document.fullscreenElement) {
                        if (container.requestFullscreen) {
                            container.requestFullscreen();
                        } else if (container.webkitRequestFullscreen) {
                            container.webkitRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    }
                });
            }

            // Sau khi vào/thoát fullscreen, nút vừa bấm giữ focus — trả phím về game.
            document.addEventListener('fullscreenchange', focusGame);

            document.querySelectorAll('.play-actions a').forEach(function (btn) {
                btn.addEventListener('click', playClick);
            });
        });
    </script>
</section>
</body>
</html>
