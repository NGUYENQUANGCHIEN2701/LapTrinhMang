<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/play.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-wide play-page">
    <h2 class="page-title">Play</h2>
    <p class="play-level">
        Level: <strong th:text="${levelName}">Màn 1</strong>
        &middot; <code th:text="${selectedLevelId}">campaign_1</code>
    </p>

    <!-- LibGDX HTML5 mount point (Phase 3.5). data-level-id duoc bootstrap doc. -->
    <div id="game-container"
         class="game-container"
         th:attr="data-level-id=${selectedLevelId}">
        <!-- iframe load GWT build; truyen levelId, soundVol, musicVol qua query string. -->
        <iframe id="game-frame"
                class="game-frame"
                th:src="@{/game/libgdx/index.html(levelId=${selectedLevelId},soundVol=${settings != null ? settings.soundVolume : 80},musicVol=${settings != null ? settings.musicVolume : 70})}"
                title="Tankzors Game"
                tabindex="0"
                allow="autoplay; fullscreen; gamepad"
                allowfullscreen></iframe>
        <noscript>
            <div class="game-placeholder">
                <p class="placeholder-title">JavaScript is required</p>
                <p class="muted">Game LibGDX HTML5 cần JavaScript để chạy.</p>
            </div>
        </noscript>
    </div>

    <script>
        // Chuyển focus vào iframe sau khi LibGDX tải xong để các phím mũi tên
        // đi tới game thay vì cuộn trang Thymeleaf bên ngoài.
        document.addEventListener('DOMContentLoaded', function () {
            var frame = document.getElementById('game-frame');
            if (!frame) return;

            var focusGame = function () {
                frame.focus();
                try {
                    frame.contentWindow.focus();
                } catch (ignored) {
                    // Same-origin ở runtime; giữ fallback frame.focus().
                }
            };

            frame.addEventListener('load', focusGame);
            frame.addEventListener('pointerdown', focusGame);
            focusGame();
        });
    </script>

    <p class="controls-hint">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / mũi tên: di chuyển &middot;
        <kbd>Space</kbd> / <kbd>J</kbd>: bắn &middot;
        <kbd>M</kbd>: tắt/bật âm thanh
    </p>

    <div class="form-actions">
        <a class="btn btn-ghost" th:href="@{/campaigns}">Back to Campaigns</a>
    </div>
</section>
</body>
</html>
