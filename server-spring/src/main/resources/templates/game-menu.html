<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: html(content = ~{::content}, pageCss = ~{::pagecss})}">
<head>
    <th:block th:fragment="pagecss">
        <link rel="stylesheet" th:href="@{/css/game-menu.css}" />
    </th:block>
</head>
<body>
<section th:fragment="content" class="page-narrow">
    <div class="tankzors-banner-wrap">
        <div class="banner-top-strip">
            <img th:src="@{/images/gui/menu_pict.png}" alt="Tankzors Banner" class="banner-tank-art" />
        </div>
        <div class="banner-fade-strip"></div>
    </div>

    <h2 class="page-title">Game Menu</h2>
    <p class="page-subtitle">Chọn chế độ chơi</p>

    <div class="mode-list">
        <a class="btn mode-btn" th:if="${continueAvailable}" th:href="@{/play}">
            Continue
            <span class="btn-hint" th:text="${continueHint}">Tiếp tục màn hiện tại</span>
        </a>
        <span class="btn mode-btn disabled" th:unless="${continueAvailable}" aria-disabled="true">
            Continue
            <span class="btn-hint" th:text="${continueHint}">Chưa tải được tiến độ</span>
        </span>
        <a class="btn mode-btn" th:href="@{/campaigns}">
            Campaigns
            <span class="btn-hint">3 màn chơi tuần tự</span>
        </a>
        <span class="btn mode-btn disabled" title="Coming soon">
            Online Levels
            <span class="badge-soon">Coming soon</span>
        </span>
        <span class="btn mode-btn disabled" title="Coming soon">
            Practice
            <span class="badge-soon">Coming soon</span>
        </span>
        <a class="btn btn-ghost mode-btn" th:href="@{/menu}">
            Back
            <span class="btn-hint">Về main menu</span>
        </a>
    </div>

    <audio id="sfx-click" th:src="@{/sounds/ui_button_down.ogg}" preload="auto"></audio>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var sfx = document.getElementById('sfx-click');
            if (!sfx) return;
            var playClick = function () {
                try {
                    sfx.currentTime = 0;
                    sfx.volume = 0.35;
                    sfx.play();
                } catch (ignored) {}
            };
            document.querySelectorAll('.btn, .site-nav a').forEach(function (btn) {
                btn.addEventListener('click', playClick);
            });
        });
    </script>
</section>
</body>
</html>
