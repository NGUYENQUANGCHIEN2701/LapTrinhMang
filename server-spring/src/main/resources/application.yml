server:
  port: 8081
  servlet:
    session:
      # Dùng cookie thay vì nhúng ;jsessionid vào URL (URL sạch và ổn định)
      tracking-mode: cookie

spring:
  application:
    name: tankzors-server-spring
  main:
    banner-mode: "off"

  # ====== Thymeleaf (Phase 4.5 website shell) ======
  # cache: false chỉ dùng cho development; production có thể bật lại.
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  # ====== JPA / Datasource (Phase 4) ======
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tankzors}
    username: ${DB_USER:tankzors}
    password: ${DB_PASSWORD:tankzors_dev_password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway quản lý schema
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.tankzors: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
