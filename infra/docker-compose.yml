# ============================================================
# infra/docker-compose.yml — One-command dev stack
#
# Chạy:
#   docker compose -f infra/docker-compose.yml up --build
#
# Dừng:
#   docker compose -f infra/docker-compose.yml down
#
# App:  http://localhost:8081
# DB:   localhost:5432 (tankzors / tankzors_dev_password)
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: tankzors-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tankzors
      POSTGRES_USER: tankzors
      POSTGRES_PASSWORD: tankzors_dev_password
      TZ: UTC
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - tankzors_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankzors -d tankzors"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: server-spring/Dockerfile
    container_name: tankzors-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tankzors
      DB_USER: tankzors
      DB_PASSWORD: tankzors_dev_password
      DB_DRIVER: org.postgresql.Driver
      SPRING_JPA_HIBERNATE_DDL-AUTO: validate
    ports:
      - "8081:8081"

volumes:
  tankzors_pg_data:
    name: tankzors_pg_data
