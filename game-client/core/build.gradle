apply plugin: 'java-library'

dependencies {
    // LibGDX core. KHÔNG thêm backend ở đây (desktop/html tự thêm).
    api "com.badlogicgames.gdx:gdx:$gdxVersion"

    // Test: JUnit 5 cho unit test gameplay core (parity với các test engine server cũ).
    // Không chạy transpiled GWT — chỉ test logic JVM thuần.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}
