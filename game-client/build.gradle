plugins {
    id 'org.gretty' version '4.1.5' apply false
    id 'org.wisepersist.gwt' version '1.1.16' apply false
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    version = '1.0-SNAPSHOT'
    group = 'com.tankzors'

    repositories {
        mavenCentral()
        google()
    }
}

subprojects {
    apply plugin: 'java-library'

    sourceCompatibility = 17
    targetCompatibility = 17

    compileJava {
        options.encoding = 'UTF-8'
    }
}

// Xóa też pom.xml legacy khi build Gradle (pom.xml Maven cũ chỉ còn reference)
tasks.register('cleanAll', Delete) {
    delete rootProject.buildDir
    subprojects.each { delete it.buildDir }
}
